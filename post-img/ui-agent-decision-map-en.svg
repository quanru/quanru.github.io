<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Choosing DOM or vision for a UI Agent</title>
  <desc id="desc">A decision table for choosing DOM automation, vision-first UI Agent behavior, or a hybrid approach.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    .subtitle { font: 400 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    .card { fill: #ffffff; stroke: #d8dee9; stroke-width: 2; rx: 24; }
    .head { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
    .body { font: 400 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    .small { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
    .chip { rx: 18; }
    .blue { fill: #eff6ff; stroke: #bfdbfe; }
    .green { fill: #ecfdf5; stroke: #a7f3d0; }
    .amber { fill: #fffbeb; stroke: #fde68a; }
    .line { stroke: #cbd5e1; stroke-width: 2; }
  </style>
  <rect class="bg" width="1200" height="720"/>
  <text class="title" x="72" y="82">When should you use DOM? When should you use vision?</text>
  <text class="subtitle" x="74" y="120">It is not a belief system. It depends on visible state, platform differences, and cost.</text>

  <rect class="card" x="72" y="172" width="322" height="424"/>
  <rect class="chip blue" x="112" y="212" width="128" height="38"/>
  <text class="small" x="143" y="237">DOM-first</text>
  <text class="head" x="112" y="294">Stable Web UI</text>
  <line class="line" x1="112" y1="326" x2="354" y2="326"/>
  <text class="body" x="112" y="368">Structure stays reliable</text>
  <text class="body" x="112" y="408">Team maintains selectors</text>
  <text class="body" x="112" y="448">Goal is low-cost testing</text>
  <text class="body" x="112" y="488">No cross-platform reuse</text>
  <text class="body" x="112" y="544">Result: DOM automation works</text>

  <rect class="card" x="438" y="172" width="322" height="424"/>
  <rect class="chip green" x="478" y="212" width="132" height="38"/>
  <text class="small" x="511" y="237">Vision-first</text>
  <text class="head" x="478" y="294">Real UI operation</text>
  <line class="line" x1="478" y1="326" x2="720" y2="326"/>
  <text class="body" x="478" y="368">Canvas / custom controls</text>
  <text class="body" x="478" y="408">Mobile, desktop, remote screens</text>
  <text class="body" x="478" y="448">Visual state matters more</text>
  <text class="body" x="478" y="488">One capability across platforms</text>
  <text class="body" x="478" y="544">Result: let the Agent see</text>

  <rect class="card" x="804" y="172" width="322" height="424"/>
  <rect class="chip amber" x="844" y="212" width="112" height="38"/>
  <text class="small" x="876" y="237">Hybrid</text>
  <text class="head" x="844" y="294">In real projects</text>
  <line class="line" x1="844" y1="326" x2="1086" y2="326"/>
  <text class="body" x="844" y="368">Vision locates and reads state</text>
  <text class="body" x="844" y="408">DOM helps extract data</text>
  <text class="body" x="844" y="448">Cache reduces repeated calls</text>
  <text class="body" x="844" y="488">Reports preserve the run</text>
  <text class="body" x="844" y="544">Result: Midscene's usual trade-off</text>

  <rect x="168" y="632" width="864" height="42" rx="21" fill="#0f172a"/>
  <text class="small" x="274" y="659" fill="#ffffff">DOM provides structure; screenshots match the visible result; code combines them.</text>
</svg>
